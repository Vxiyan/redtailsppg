<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RedtailsPPG</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.png">
</head>

<body>
    <img src="assets/logo.png" alt="RedtailsPPG Logo" class="logo-bg">
    <header>
        <img src="assets/logo.png" alt="RedtailsPPG Logo" class="logo-head">
        <p class="header-title">Redtails PPG</p>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="home">
            <div class="scroll-container">
                    <img src="assets/fire.jpg" alt="Scroll Icon" class="scroll-icon">
                    <img src="assets/wam.png" alt="Scroll Icon" class="scroll-icon">
                    <img src="assets/Xunia.png" alt="Scroll Icon" class="scroll-icon">
                    <img src="assets/fire.jpg" alt="Scroll Icon" class="scroll-icon">
                    <img src="assets/wam.png" alt="Scroll Icon" class="scroll-icon">
                    <img src="assets/Xunia.png" alt="Scroll Icon" class="scroll-icon">
            </div>
            <div class="home-scheduling">
         <!-- Placeholder for status indicator -->
                <span>Here you can schedule an appointment with Redtails PPG.

Please make sure to enter your email and name so that we can contact you.</span>
                <form class="appointment-form" id="appointment-form" action="#" method="post">
                    <label for="appointment-name">Full Name:</label>
                    <input type="text" id="appointment-name" name="appointment-name" required>
                    <label for="appointment-email">Email:</label>
                    <input type="email" id="appointment-email" name="appointment-email" required>
                    <label for="appointment-date">Date:</label>
                    <input type="date" id="appointment-date" name="appointment-date" required>
                    <input disabled type="submit" id="submit-btn" value="Schedule Appointment">
                    <p id="availability-status"></p> <!-- Placeholder for availability status -->
                </form>
            </div>
        </section>
        <section id="about">
            <h2>About Redtails PPG</h2>
            <div class="about-content">
                <h3>Description</h3>
                <p>Redtails PPG is a [DESCRIPTION HERE]</p>
            </div>
        </section>
        <section id="contactSec">
            <h2>Contact Us</h2>
            <div class="contact-container">
                <address></address>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy 2026 Redtails PPG
    </footer>
    <script src="script.js"></script>
</body>
</html>
